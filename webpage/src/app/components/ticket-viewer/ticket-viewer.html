<div class="p-6 bg-white shadow rounded-lg">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Ticket Viewer</h2>

    <div class="flex space-x-2 mb-4">
        <button (click)="filterTickets('All')" [class.bg-indigo-600]="currentFilter === 'All'"
            [class.bg-gray-200]="currentFilter !== 'All'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition duration-150 ease-in-out"
            [ngClass]="currentFilter === 'All' ? 'text-white' : 'text-gray-700'">
            All
        </button>
        <button (click)="filterTickets('Open')" [class.bg-indigo-600]="currentFilter === 'Open'"
            [class.bg-gray-200]="currentFilter !== 'Open'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition duration-150 ease-in-out"
            [ngClass]="currentFilter === 'Open' ? 'text-white' : 'text-gray-700'">
            Open
        </button>

        <button (click)="filterTickets('Closed')" [class.bg-indigo-600]="currentFilter === 'Closed'"
            [class.bg-gray-200]="currentFilter !== 'Closed'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition duration-150 ease-in-out"
            [ngClass]="currentFilter === 'Closed' ? 'text-white' : 'text-gray-700'">
            Closed
        </button>

        <button (click)="filterTickets('In Progress')" [class.bg-indigo-600]="currentFilter === 'In Progress'"
            [class.bg-gray-200]="currentFilter !== 'In Progress'"
            class="px-4 py-2 rounded-lg text-sm font-medium transition duration-150 ease-in-out"
            [ngClass]="currentFilter === 'In Progress' ? 'text-white' : 'text-gray-700'">
            In Progress
        </button>
    </div>

    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created
                        At</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let ticket of filteredTickets" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-indigo-600 cursor-pointer">{{
                        ticket.id }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ ticket.subject }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span [ngSwitch]="ticket.status"
                            class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
                            <span *ngSwitchCase="'Open'" class="bg-red-100 text-red-800">Open</span>
                            <span *ngSwitchCase="'In Progress'" class="bg-yellow-100 text-yellow-800">In Progress</span>
                            <span *ngSwitchCase="'Closed'" class="bg-green-100 text-green-800">Closed</span>
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ ticket.createdAt }}</td>
                </tr>
                <tr *ngIf="filteredTickets.length === 0">
                    <td colspan="4" class="text-center py-4 text-gray-500">No tickets match the current filter.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
